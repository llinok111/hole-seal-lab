<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hole-seal-lab — exact minimax hole filling with a watertight certificate</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
           background: #0e1116; color: #d7dee8; overflow: hidden; }
    #hud { position: fixed; top: 12px; left: 12px; width: 330px; padding: 12px 14px;
           background: rgba(18,23,31,.92); border: 1px solid #2a3444; border-radius: 10px; }
    h1 { font-size: 15px; margin: 0 0 6px; color: #8fd3ff; }
    .sub { color: #8a97a8; margin-bottom: 10px; }
    select, button { font: inherit; background: #1b2330; color: #d7dee8; border: 1px solid #35455c;
                     border-radius: 6px; padding: 4px 8px; }
    button.active { background: #1d4f7a; border-color: #4ea8de; }
    #out { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
    #out b { color: #ffd479; font-weight: 600; }
    .ok { color: #6ee7a8; } .bad { color: #ff7b7b; }
    #cert { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: #14202b; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="hud">
  <h1>hole-seal-lab</h1>
  <div class="sub">Exact minimax hole filling + watertight certificate. Same <code>src/core.mjs</code> as node.</div>
  <div>
    <select id="mesh"></select>
    <button id="toggle">Seal holes</button>
  </div>
  <div id="out"></div>
  <div id="cert"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
